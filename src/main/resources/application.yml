server:
  port: 3001
  servlet:
    context-path: /api/v1

cors:
  allowed-origins: http://localhost:5173,http://localhost:3001

spring:
  application:
    name: mdb-admin-bff-service
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: mdb-admin-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    # url: jdbc:postgresql://localhost:5433/mdb_prod?currentSchema=public
    url: jdbc:postgresql://localhost:5433/mdb_prod
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

grpc:
  client:
    media-gateway:
      host: ${MEDIA_GATEWAY_HOST:localhost}
      port: ${MEDIA_GATEWAY_PORT:9090}

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

info:
  app:
    name: mdb-admin-bff-service
    version: 1.0.0

resilience4j:
  circuitbreaker:
    instances:
      externalService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      externalService:
        limitForPeriod: 10
        limitRefreshPeriod: 10s
        timeoutDuration: 0
      notifications:
        limitForPeriod: 10
        limitRefreshPeriod: 10s
        timeoutDuration: 0

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 1 day
  refresh-expiration: 604800000 # 7 days

logging:
  level:
    root: INFO
    com.mdb.adminbff: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"