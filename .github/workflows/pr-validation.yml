name: PR Validation

on:
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build and Generate Proto
        run: ./gradlew generateProto assemble

      - name: Run Static Analysis (Checkstyle)
        run: |
          cp config/checkstyle/checkstyle.xml /tmp/checkstyle.xml
          ./gradlew checkstyleMain -Pcheckstyle.configFile=/tmp/checkstyle.xml

      - name: Run Tests and Coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-key-at-least-32-characters-long' }}

      - name: Post Test Results
        if: always() && env.ACT != 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "build/test-results/test/*.xml"

      # - name: Post Coverage Report
      #   if: always() && env.ACT != 'true'
      #   uses: madrapps/jacoco-report@v1.6.1
      #   with:
      #     paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     min-coverage-overall: 80
      #     min-coverage-changed-files: 80


      - name: Validate Docker Build
        run: docker build .
